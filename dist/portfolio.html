<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e0c18" />
    <meta
      name="description"
      content="Three.js ile hazırlanmış, tarayıcıda keşfedilebilen etkileşimli bir gece bahçesi."
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>Bir Dilek Gecesi · Demo</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css?v=5.0" />
  </head>
  <body data-mode="intro">
    <main id="world" data-label="page.worldLabel"></main>
    <div class="vignette" aria-hidden="true"></div>

    <!-- Neutral portfolio entry; open with ?demo=1 for the demo content. -->
    <section class="intro screen" id="intro" aria-labelledby="intro-title">
      <div class="intro-copy">
        <p class="eyebrow intro-date" data-text="intro.date">
          Etkileşimli WebGL deneyimi
        </p>
        <h1 id="intro-title">
          <span data-text="intro.title">Hazır mısın,</span><br /><em
            data-text="intro.name"
            >keşfetmeye?</em
          >
        </h1>
        <button class="button button-main" id="start" disabled>
          <span id="start-label" data-text="intro.loading">Yükleniyor</span>
          <span class="loader" id="loader" aria-hidden="true"></span>
          <span id="start-arrow" hidden aria-hidden="true">↗</span>
        </button>
        <p
          class="loading-status"
          id="loading-status"
          role="status"
          data-text="intro.loadingStatus"
        >
          Bahçe hazırlanıyor…
        </p>
        <button
          class="text-button"
          id="fallback-letter"
          data-text="intro.fallback"
          hidden
        ></button>
      </div>
    </section>

    <div class="hud" id="hud" hidden>
      <div class="hud-top">
        <div class="hud-actions">
          <button
            class="icon-button"
            id="music"
            aria-pressed="false"
            data-label="controls.musicOff"
            data-title="controls.musicTitle"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 18V5l11-2v13M9 8l11-2" />
              <ellipse cx="6" cy="18" rx="3" ry="2" />
              <ellipse cx="17" cy="16" rx="3" ry="2" />
            </svg>
          </button>
          <button
            class="icon-button"
            id="help"
            data-label="controls.help"
            data-title="controls.helpTitle"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M9.6 9a2.5 2.5 0 0 1 4.8 1c0 2-2.4 2-2.4 4m0 3h.01" />
            </svg>
          </button>
          <button
            class="icon-button"
            id="pause"
            data-label="controls.pause"
            data-title="controls.pauseTitle"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5v14M16 5v14" />
            </svg>
          </button>
        </div>
      </div>
      <div class="crosshair" id="crosshair" aria-hidden="true"><i></i></div>
      <div class="target-prompt" id="target-prompt" hidden>
        <span id="target-name"></span>
        <button id="interact">
          <kbd>E</kbd><span id="target-action"></span
          ><span class="click-hint" data-text="controls.click"></span>
        </button>
      </div>
      <div class="control-guide" id="control-guide">
        <span
          ><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd
          ><span data-text="controls.walk"></span></span
        ><i></i> <span data-text="controls.look"></span><i></i>
        <span><kbd>E</kbd><span data-text="controls.interact"></span></span
        ><i></i>
        <span><kbd>Esc</kbd><span data-text="controls.pause"></span></span>
      </div>
      <div class="touch-controls">
        <div
          class="joystick"
          id="joystick"
          role="group"
          data-label="controls.touchWalk"
        >
          <span class="joystick-hint" data-text="controls.touchWalk"></span
          ><i id="joystick-knob"></i>
        </div>
        <span class="touch-look-hint" data-text="controls.touchLook"></span>
      </div>
      <button
        class="free-look"
        id="free-look"
        data-text="controls.freeLook"
        hidden
      ></button>
    </div>

    <dialog id="pause-dialog" class="menu-dialog" aria-labelledby="pause-title">
      <h2 id="pause-title" data-text="pause.title"></h2>
      <button
        class="button button-main"
        id="resume"
        data-text="pause.resume"
      ></button>
      <button
        class="button button-subtle"
        id="reset"
        data-text="pause.reset"
      ></button>
      <button
        class="text-button"
        id="pause-music"
        data-text="controls.musicOff"
      ></button>
    </dialog>

    <dialog id="help-dialog" class="menu-dialog" aria-labelledby="help-title">
      <h2 id="help-title" data-text="help.title"></h2>
      <div class="key-guide">
        <p>
          <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span
          ><span data-text="help.walk"></span>
        </p>
        <p>
          <span data-text="help.mouse"></span
          ><span data-text="help.look"></span>
        </p>
        <p>
          <span data-text="help.useKey"></span
          ><span data-text="help.use"></span>
        </p>
        <p>
          <span><kbd>Esc</kbd></span
          ><span data-text="help.pause"></span>
        </p>
        <p>
          <span><kbd>M</kbd></span
          ><span data-text="help.music"></span>
        </p>
      </div>
      <p class="help-note" data-text="help.aim"></p>
      <p class="help-note" data-text="help.touch"></p>
      <button
        class="button button-main"
        id="close-help"
        data-text="help.close"
      ></button>
    </dialog>

    <dialog id="wish-dialog" class="menu-dialog" aria-labelledby="wish-title">
      <h2 id="wish-title" data-text="wish.title"></h2>
      <button
        class="button button-main"
        id="blow"
        data-text="wish.blow"
      ></button>
      <button
        class="text-button"
        id="close-wish"
        data-text="wish.close"
      ></button>
    </dialog>

    <dialog
      id="easter-dialog"
      class="menu-dialog"
      aria-labelledby="easter-title"
    >
      <div class="easter-mascot-frame">
        <img
          class="easter-mascot"
          src="./takodachi-transparent.png"
          alt="Takodachi"
          width="180"
          height="180"
        />
      </div>
      <h2 id="easter-title" data-text="easter.title"></h2>
      <button
        class="button button-main"
        id="close-easter"
        data-text="easter.close"
      ></button>
    </dialog>

    <dialog id="letter" class="letter-dialog" aria-labelledby="letter-title">
      <article class="letter-shell">
        <button
          class="close-letter"
          id="close-letter"
          data-label="letter.closeLabel"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
        <div class="letter-heading"><p data-text="letter.heading"></p></div>
        <h2 id="letter-title" data-text="letter.greeting"></h2>
        <div class="letter-body">
          <div id="letter-paragraphs"></div>
          <p class="letter-final" data-text="letter.final"></p>
        </div>
        <div class="signature">
          <strong data-text="letter.signature"></strong>
        </div>
        <button
          class="letter-return"
          id="letter-return"
          data-text="letter.return"
        ></button>
      </article>
    </dialog>

    <div class="celebration-message" id="celebration-message" hidden>
      <h2 data-text="messages.celebration"></h2>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <noscript
      ><div class="no-script">
        Bahçeyi açmak için tarayıcında JavaScript’i etkinleştir.
      </div></noscript
    >
    <script type="module" src="./app.js?v=5.0"></script>
  </body>
</html>
